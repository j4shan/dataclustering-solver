  <figure class="illustration" id="D.lorenz-wealth">

          wealth share on the vertical axis. The equality diagonal is a
          solid line. One path stays near the diagonal. A second path sags
          and then rises. The bow between the diagonal and that second path
          is labelled as the Gini coefficient.
        </desc>
        <defs>
          <pattern id="d-gini-bow" width="8" height="8"
                   patternUnits="userSpaceOnUse" patternTransform="rotate(45)">

        <!-- plot frame: origin at (80, 300), 240×240 box -->
        <text x="200" y="28" text-anchor="middle" font-size="13"
