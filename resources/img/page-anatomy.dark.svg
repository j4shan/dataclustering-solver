<svg xmlns="http://www.w3.org/2000/svg" width="880" height="674" viewBox="0 0 880 674" role="img"><title>The anatomy of the demonstration page: navigation, the three sections it selects between, and the panes each holds</title><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#1a1a19" stroke-width="2.4"/></pattern></defs><rect x="0" y="0" width="880" height="674" rx="0" fill="#1a1a19" stroke="none" stroke-width="1"/><text x="22" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start">The demonstration page, section by section</text><text x="22" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">One local page on loopback — three sections in fixed order, one shown at a time, each a left and a right pane on a wide viewport</text><rect x="22" y="70" width="836" height="34" rx="6" fill="#26261f" stroke="#333331" stroke-width="1"/><text x="36" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">The Data Storage Layout Problem</text><rect x="284.0" y="77" width="133.8" height="20" rx="5" fill="#1a1a19" stroke="#333331" stroke-width="1"/><text x="350.9" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">A Problem Statement</text><rect x="425.8" y="77" width="177.20000000000002" height="20" rx="5" fill="#1a1a19" stroke="#333331" stroke-width="1"/><text x="514.4" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">B Data Skipping Experiment</text><rect x="611.0" y="77" width="233.0" height="20" rx="5" fill="#1a1a19" stroke="#333331" stroke-width="1"/><text x="727.5" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">C Spark + Delta Lake Implementation</text><rect x="22" y="116" width="836" height="154" rx="8" fill="none" stroke="#333331" stroke-width="1"/><rect x="36" y="125" width="20" height="20" rx="5" fill="#26261f" stroke="none" stroke-width="1"/><text x="46" y="139" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c3c2b7" text-anchor="middle" font-variant-numeric="tabular-nums">A</text><text x="64" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Organizing a data warehouse like a closet</text><text x="844" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#898781" text-anchor="end">a document — nothing to configure</text><rect x="36" y="152" width="397.0" height="104" rx="6" fill="none" stroke="#333331" stroke-width="1"/><text x="48" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">The closet walkthrough</text><text x="48" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">one outfit and its wasted handling,</text><text x="48" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">the same fetch with technical names,</text><text x="48" y="224" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">one learned assignment change</text><rect x="447.0" y="152" width="397.0" height="104" rx="6" fill="none" stroke="#333331" stroke-width="1"/><text x="459.0" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">The formal statement</text><text x="459.0" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">problem-statement.md, pre-rendered</text><text x="459.0" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">native MathML, with its own contents list</text><rect x="22" y="282" width="836" height="186" rx="8" fill="none" stroke="#333331" stroke-width="1"/><rect x="36" y="291" width="20" height="20" rx="5" fill="#26261f" stroke="none" stroke-width="1"/><text x="46" y="305" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c3c2b7" text-anchor="middle" font-variant-numeric="tabular-nums">B</text><text x="64" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Assignment Strategy Benchmark</text><text x="844" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#898781" text-anchor="end">the interactive section — runs the harness</text><rect x="36" y="318" width="397.0" height="136" rx="6" fill="none" stroke="#333331" stroke-width="1"/><text x="48" y="339" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">Candidate builder</text><text x="48" y="358" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">up to four candidates, each a chain of</text><text x="48" y="374" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">group-by expressions over the feature columns</text><text x="48" y="390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">plus the container capacities to sweep</text><text x="48" y="406" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">one Evaluate button — all candidates at once</text><rect x="447.0" y="318" width="397.0" height="136" rx="6" fill="none" stroke="#333331" stroke-width="1"/><text x="459.0" y="339" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">Benchmark report</text><rect x="459.0" y="344" width="373.0" height="26" rx="5" fill="#26261f" stroke="#333331" stroke-width="1"/><text x="469.0" y="361" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#3987e5" text-anchor="start" font-variant-numeric="tabular-nums">P1</text><text x="493.0" y="361" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">process diagram — what was built</text><rect x="459.0" y="378" width="373.0" height="26" rx="5" fill="#26261f" stroke="#333331" stroke-width="1"/><text x="469.0" y="395" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#3987e5" text-anchor="start" font-variant-numeric="tabular-nums">P2</text><text x="493.0" y="395" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">summary table — what it scored</text><rect x="459.0" y="412" width="373.0" height="26" rx="5" fill="#26261f" stroke="#333331" stroke-width="1"/><text x="469.0" y="429" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#3987e5" text-anchor="start" font-variant-numeric="tabular-nums">P3</text><text x="493.0" y="429" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">paired scatter plots — how the scores trade off</text><rect x="22" y="480" width="836" height="138" rx="8" fill="none" stroke="#333331" stroke-width="1"/><rect x="36" y="489" width="20" height="20" rx="5" fill="#26261f" stroke="none" stroke-width="1"/><text x="46" y="503" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c3c2b7" text-anchor="middle" font-variant-numeric="tabular-nums">C</text><text x="64" y="504" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Spark + Delta Lake Implementation</text><text x="844" y="504" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#898781" text-anchor="end">a document — nothing to configure</text><rect x="36" y="516" width="397.0" height="88" rx="6" fill="none" stroke="#333331" stroke-width="1"/><text x="48" y="537" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">The engine mapping</text><text x="48" y="556" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">production-design.md, pre-rendered</text><text x="48" y="572" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">at Section A's parity</text><rect x="447.0" y="516" width="397.0" height="88" rx="6" fill="none" stroke="#333331" stroke-width="1"/><text x="459.0" y="537" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">The mechanisms drawn</text><text x="459.0" y="556" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">three diagrams: the file as container,</text><text x="459.0" y="572" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">clustering as layout, statistics as index</text><text x="22" y="642" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Sections A and C are documents to read; B is the one that runs the harness.</text><text x="22" y="659" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="start">Nothing is fetched from a network — every asset comes from the local process, and an evaluation is kept nowhere.</text></svg>