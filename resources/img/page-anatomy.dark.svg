<svg xmlns="http://www.w3.org/2000/svg" width="880" height="840" viewBox="0 0 880 840" role="img"><title>The anatomy of the demonstration page: navigation, the four sections it selects between, and the panes each holds</title><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#1a1a19" stroke-width="2.4"/></pattern></defs><rect x="0" y="0" width="880" height="840" rx="0" fill="#1a1a19" stroke="none" stroke-width="1"/><text x="22" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start">The demonstration page, section by section</text><text x="22" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">One local page on loopback — four sections in fixed order, one shown at a time, each a left and a right pane on a wide viewport</text><rect x="22" y="70" width="836" height="34" rx="6" fill="#26261f" stroke="#333331" stroke-width="1"/><text x="36" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">The Data Storage Layout Problem</text><rect x="142.19999999999993" y="77" width="133.8" height="20" rx="5" fill="#1a1a19" stroke="#333331" stroke-width="1"/><text x="209.09999999999994" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">A Problem Statement</text><rect x="283.99999999999994" y="77" width="177.20000000000002" height="20" rx="5" fill="#1a1a19" stroke="#333331" stroke-width="1"/><text x="372.59999999999997" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">B Data Skipping Experiment</text><rect x="469.19999999999993" y="77" width="233.0" height="20" rx="5" fill="#1a1a19" stroke="#333331" stroke-width="1"/><text x="585.6999999999999" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">C Spark + Delta Lake Implementation</text><rect x="710.1999999999999" y="77" width="133.8" height="20" rx="5" fill="#1a1a19" stroke="#333331" stroke-width="1"/><text x="777.0999999999999" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">D Gini Split Search</text><rect x="22" y="116" width="836" height="154" rx="8" fill="none" stroke="#333331" stroke-width="1"/><rect x="36" y="125" width="20" height="20" rx="5" fill="#26261f" stroke="none" stroke-width="1"/><text x="46" y="139" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c3c2b7" text-anchor="middle" font-variant-numeric="tabular-nums">A</text><text x="64" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Organizing Data Like a Medicine Cabinet</text><text x="844" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#898781" text-anchor="end">a document — nothing to configure</text><rect x="36" y="152" width="397.0" height="104" rx="6" fill="none" stroke="#333331" stroke-width="1"/><text x="48" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">The medicine-cabinet walkthrough</text><text x="48" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">one prescription batch and wasted handling,</text><text x="48" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">the same retrieval with technical names,</text><text x="48" y="224" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">one demand-informed restocking example</text><rect x="447.0" y="152" width="397.0" height="104" rx="6" fill="none" stroke="#333331" stroke-width="1"/><text x="459.0" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">The formal statement</text><text x="459.0" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">problem-statement.md, pre-rendered</text><text x="459.0" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">native MathML, with its own contents list</text><rect x="22" y="282" width="836" height="186" rx="8" fill="none" stroke="#333331" stroke-width="1"/><rect x="36" y="291" width="20" height="20" rx="5" fill="#26261f" stroke="none" stroke-width="1"/><text x="46" y="305" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c3c2b7" text-anchor="middle" font-variant-numeric="tabular-nums">B</text><text x="64" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Assignment Strategy Benchmark</text><text x="844" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#898781" text-anchor="end">a pre-scored catalogue — nothing is computed here</text><rect x="36" y="318" width="397.0" height="136" rx="6" fill="none" stroke="#333331" stroke-width="1"/><text x="48" y="339" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">Strategy catalogue</text><text x="48" y="358" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">six fixtures, each a chain of</text><text x="48" y="374" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">group-by expressions over the feature columns</text><text x="48" y="390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">swept across four container capacities</text><text x="48" y="406" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">select up to four to compare</text><rect x="447.0" y="318" width="397.0" height="136" rx="6" fill="none" stroke="#333331" stroke-width="1"/><text x="459.0" y="339" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">Benchmark report</text><rect x="459.0" y="344" width="373.0" height="26" rx="5" fill="#26261f" stroke="#333331" stroke-width="1"/><text x="469.0" y="361" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#3987e5" text-anchor="start" font-variant-numeric="tabular-nums">P1</text><text x="493.0" y="361" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">process diagram — what was built</text><rect x="459.0" y="378" width="373.0" height="26" rx="5" fill="#26261f" stroke="#333331" stroke-width="1"/><text x="469.0" y="395" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#3987e5" text-anchor="start" font-variant-numeric="tabular-nums">P2</text><text x="493.0" y="395" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">summary table — what it scored</text><rect x="459.0" y="412" width="373.0" height="26" rx="5" fill="#26261f" stroke="#333331" stroke-width="1"/><text x="469.0" y="429" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#3987e5" text-anchor="start" font-variant-numeric="tabular-nums">P3</text><text x="493.0" y="429" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">paired scatter plots — how the scores trade off</text><rect x="22" y="480" width="836" height="138" rx="8" fill="none" stroke="#333331" stroke-width="1"/><rect x="36" y="489" width="20" height="20" rx="5" fill="#26261f" stroke="none" stroke-width="1"/><text x="46" y="503" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c3c2b7" text-anchor="middle" font-variant-numeric="tabular-nums">C</text><text x="64" y="504" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Spark + Delta Lake Implementation</text><text x="844" y="504" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#898781" text-anchor="end">a document — nothing to configure</text><rect x="36" y="516" width="397.0" height="88" rx="6" fill="none" stroke="#333331" stroke-width="1"/><text x="48" y="537" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">The engine mapping</text><text x="48" y="556" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">production-design.md, pre-rendered</text><text x="48" y="572" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">at Section A's parity</text><rect x="447.0" y="516" width="397.0" height="88" rx="6" fill="none" stroke="#333331" stroke-width="1"/><text x="459.0" y="537" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">The mechanisms drawn</text><text x="459.0" y="556" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">three diagrams: the file as container,</text><text x="459.0" y="572" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">clustering as layout, statistics as index</text><rect x="22" y="630" width="836" height="154" rx="8" fill="none" stroke="#333331" stroke-width="1"/><rect x="36" y="639" width="20" height="20" rx="5" fill="#26261f" stroke="none" stroke-width="1"/><text x="46" y="653" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c3c2b7" text-anchor="middle" font-variant-numeric="tabular-nums">D</text><text x="64" y="654" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Where usage concentrates</text><text x="844" y="654" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#898781" text-anchor="end">a document — nothing to configure</text><rect x="36" y="666" width="397.0" height="104" rx="6" fill="none" stroke="#333331" stroke-width="1"/><text x="48" y="687" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">The Gini walkthrough</text><text x="48" y="706" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">inequality of wealth,</text><text x="48" y="722" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">usage as a screen for splits,</text><text x="48" y="738" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">a search that grows and stops</text><rect x="447.0" y="666" width="397.0" height="104" rx="6" fill="none" stroke="#333331" stroke-width="1"/><text x="459.0" y="687" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">The constructions drawn</text><text x="459.0" y="706" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">Lorenz bow, two cuts of twelve events,</text><text x="459.0" y="722" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start">chain versus tree, search trajectory</text><text x="22" y="808" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Sections A, C and D are documents to read; B presents a catalogue scored offline.</text><text x="22" y="825" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="start">Nothing is fetched from a network — every asset comes from the local process, and nothing is computed while you look.</text></svg>