<div class="illustration-stack">
  <figure

    <div class="illustration-stage">
      <img
        src="figures/img/section_c_go_live_process.png"

    class="illustration raster-illustration"
    id="C.data-ingestion"

    <div class="illustration-stage">
      <img
        src="figures/img/section_c_data_ingestion.png"

      />

  <figure
    class="illustration raster-illustration"

    <div class="illustration-stage">
      <img
        src="figures/img/section_c_dpp_skipping.png"
        alt="A multi-select query brand_id IN (A, B) AND pricing_tier = 1 prescans the four-row index table. Rows for p1 and p3 match. Spark DPP broadcasts that set to two worker cards as a metadata filter. Four cloud-object glyphs follow: p1 and p3 marked download, p2 and p4 marked skip."
      />

    <figcaption>
      A multi-select query prescans the index; Spark DPP broadcasts p1 and
