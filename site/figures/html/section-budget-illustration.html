  Drawing Storage Boundary, right pane (12.9): three figures, one per
  walkthrough section. Numbers are hypothesized in each figure's
  instance, not read from a provider dataset or catalog. The first raster is
  committed and drawn from
  resources/img_prompt/section_budget_storage_limits_prompt.txt. The second figure is
  authored in draw.io from resources/img_src/section_budget_knapsack_ladder.drawio

<div class="illustration-stack">
  <figure
    class="illustration raster-illustration"
    id="budget.storage-limits"
    aria-labelledby="budget-storage-limits-title"
  >
    <h3 id="budget-storage-limits-title">The Container Assignment Problem</h3>
    <div class="illustration-stage">
      <img
        src="figures/img/section_budget_storage_limits.png"
        alt="Original Data is cut by a CASE on [Price] into two terminal groups, one for [Price] above $20 and one for [Price] at or below it. Each group lists four metrics: its record count, its selectivity, its expected data skipping ratio as a function of its container count, and its marginal benefit per container. A shared store labelled container budget = 1,000 sends one arrow to each group, tagged K1 containers and K2 containers."
      />
    </div>
    <figcaption>
      One CASE on [Price] cuts Original Data into two terminal groups; a
      shared store of 1,000 containers sends K1 to one group and K2 to the
      other, and the objective maximizes the weighted-average data-skipping
      ratio subject to K1 + K2 = 1,000.
    </figcaption>
  </figure>

  <hr class="illustration-rule"/>

  <figure
    class="illustration raster-illustration"
    id="budget.knapsack-ladder"
    aria-labelledby="budget-knapsack-ladder-title"
  >
    <h3 id="budget-knapsack-ladder-title">Convert to Multiple-Choice Knapsack Problem (MCKP)</h3>
    <div class="illustration-stage">
      <img
        src="figures/img/section_budget_knapsack_ladder.png"
        alt="A term dictionary defines container capacity as 1,000 records per container, K as a geometric series with common ratio 4, V as the records a query can skip at that K, and delta V over delta K as marginal efficiency. Below it the predicate price_tier greater than 5 splits 480,000 records into two chains, Yes with 80,000 and No with 400,000. Each chain runs through four container counts, K = 1, 4, 16 and 64, joined by three arrows labelled with the added containers and the marginal efficiency. Both chains start at a green Initial single container node; the No chain has advanced to an activated K = 4. The next upgrade option on each chain carries an orange dashed border, and a dashed curve joins the two, with a card reading that No going from K = 4 to K = 16 wins at 7,441 against 5,427."
      />
    </div>
    <figcaption>
      One price predicate cuts 480,000 records into two chains; each geometric
      container count is an option on its chain, each step is priced by its
      marginal efficiency, and the two steps the chains could take next are
      compared. Both chains show diminishing returns.
    </figcaption>
  </figure>

  <hr class="illustration-rule"/>

  <figure
    class="illustration raster-illustration"
    id="budget.greedy-guardrails"
    aria-labelledby="budget-greedy-guardrails-title"
  >
    <h3 id="budget-greedy-guardrails-title">Greedy Optimality relies on Decaying Marginal Efficiency</h3>
    <div class="illustration-stage">
      <img
        src="figures/img/section_budget_greedy_guardrails.png"
        alt="One terminal group, the Yes branch of Price greater than 20 holding 1,600 records, drawn as a single container chain from K = 1 to K max = 20 on one horizontal axis. Two vertical axes share those counts: on the left, the expected data skipping volume V of K as a dark-green marked line rising from 0 to 559.9 records; on the right, the marginal efficiency delta V over delta K as one bar per unit step. The bars rise to a tallest step of 41.2 at K = 10 to K = 11, then decay to the right. A dashed vertical rule at K nought = np / 2 = 10.5 splits the plot into a warm-rose convex half, where the incremental data skipping volume brought by every new container increases and greedy has no guarantee, and a cool-sage concave half, where that incremental volume decreases and the greedy theorem holds. The tallest bar straddles that rule. A side panel states the Poisson model: V of K equals n times e to the minus np over K, the delta V over delta K step, and the second derivative d squared V over d K squared, whose sign flips where np over K equals 2. Below, three guardrail cards give the starting count cutting K = 1 through K = 10, the size floor closing the chain at K = 20, and a typical 50 percent skip bar that is missed because Pr at K = 20 is only 35.0 percent. A final strip redraws the chain with counts 1 through 10 struck through and counts 11 through 20 offered."
      />
    </div>
    <figcaption>
      One group carried as a single container chain plots the expected data
      skipping volume and its marginal efficiency against the same counts.
      Marginal efficiency rises until the inflection at K = 10.5 and decays
      after it, so only the second half satisfies the condition greedy needs;
      the three guardrails then cut the chain back to K = 11 through K = 20.
    </figcaption>
  </figure>
</div>
