      <p class="illustration-kicker split-sql-lead">A split action can be either a multi-way grouping or a local conditional grouping. A custom split tree is easily expressed as a query.</p>
      <pre class="split-sql"><code class="language-sql">SELECT
  CASE
    WHEN brand_id IN ('A', 'B', 'C', 'D', 'E') THEN brand_id
    ELSE 'Rest combined'
  END AS l1,
  CASE
    WHEN brand_id = 'A' THEN
      CASE WHEN feature_category = 'brakes' THEN 'brakes' ELSE 'not brakes' END
    WHEN brand_id = 'B' THEN
      CASE WHEN feature_price_tier &gt; 5 THEN 'tier &gt; 5' ELSE 'tier &lt;= 5' END
    ELSE 'uncut'
  END AS l2
FROM sales
GROUP BY l1, l2</code></pre>
