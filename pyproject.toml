# Declared rather than inferred (10.3.9).  Without it, setuptools' flat-layout discovery
# meets `simulator/` beside `project_metadata/` and `data/` and refuses to guess, so the
# documented `pip install -e .` fails on a clean checkout.  One package ships; the
# specification, the figures and the generated data are not it.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simulator*"]

[project]
name = "dataclustering-solver"
version = "0.1.0"
requires-python = ">=3.12"
# 10.3.1 splits the dependency set in two, and this is the half that serves the page: the
# named minimal ASGI stack and nothing beyond it.  Every figure the page displays was
# authored or rendered ahead of serving, so the serving process has nothing to compute
# (12.2.5).  Keeping the numeric stack out is what makes that structural — the libraries
# a violation would need are not installed — and it is 174 MB the page does not carry.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# The other half of 10.3.1: what builds a corpus and reads one back.  `generate` needs
# it; `gui` never does, and fails naming this group rather than raising an ImportError
# (10.3.9).
data = ["numpy>=2.0", "pyarrow>=15"]
# Everything `python -m pytest` needs to run the *whole* suite (10.3.9).  It pulls in
# `data` because part of the suite builds a corpus: without it those tests are silently
# not collected — and a documented command that quietly runs less than it appears to is
# the same defect as one that does not run at all.
dev = ["dataclustering-solver[data]", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
