<svg xmlns="http://www.w3.org/2000/svg" width="734" height="338" viewBox="0 0 734 338" role="img"><title>An activated container with wasted events, beside a bypassed container</title><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#1a1a19" stroke-width="2.4"/></pattern></defs><rect x="0" y="0" width="734" height="338" rx="0" fill="#1a1a19" stroke="none" stroke-width="1"/><text x="22" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start">Inside two containers, during one query</text><text x="22" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">Query 106 · “Cold rain” · selects raincoat, scarf, wool-coat</text><rect x="22" y="70" width="330" height="208" rx="10" fill="none" stroke="#333331" stroke-width="1"/><rect x="38" y="88" width="20" height="20" rx="5" fill="#26261f" stroke="none" stroke-width="1"/><text x="48" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c3c2b7" text-anchor="middle" font-variant-numeric="tabular-nums">4</text><text x="68" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Container 4 — OPENED</text><text x="38" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="start">summary page says:  sport · summer · rain</text><rect x="38" y="150" width="15" height="15" rx="3" fill="#d03b3b" stroke="none" stroke-width="1"/><rect x="38" y="150" width="15" height="15" rx="3" fill="url(#hatch)" stroke="none" stroke-width="1"/><text x="62" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">ski-jacket</text><text x="336" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#d03b3b" text-anchor="end">opened, not selected</text><rect x="38" y="180" width="15" height="15" rx="3" fill="#d03b3b" stroke="none" stroke-width="1"/><rect x="38" y="180" width="15" height="15" rx="3" fill="url(#hatch)" stroke="none" stroke-width="1"/><text x="62" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">straw-hat</text><text x="336" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#d03b3b" text-anchor="end">opened, not selected</text><rect x="38" y="210" width="15" height="15" rx="3" fill="#3987e5" stroke="none" stroke-width="1"/><text x="62" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">raincoat</text><text x="336" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="end">selected</text><rect x="38" y="240" width="298" height="1" rx="0" fill="#2c2c2a" stroke="none" stroke-width="1"/><text x="38" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d03b3b" text-anchor="start">3 read · 1 selected · 2 wasted</text><rect x="382" y="70" width="330" height="208" rx="10" fill="none" stroke="#333331" stroke-width="1" stroke-dasharray="5 4"/><rect x="398" y="88" width="20" height="20" rx="5" fill="#26261f" stroke="none" stroke-width="1"/><text x="408" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c3c2b7" text-anchor="middle" font-variant-numeric="tabular-nums">3</text><text x="428" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#898781" text-anchor="start">Container 3 — SKIPPED</text><text x="398" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="start">summary page says:  formal · evening</text><rect x="398" y="150" width="15" height="15" rx="3" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="422" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">tuxedo</text><text x="696" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#898781" text-anchor="end">not read</text><rect x="398" y="180" width="15" height="15" rx="3" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="422" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">dress-shoes</text><text x="696" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#898781" text-anchor="end">not read</text><rect x="398" y="210" width="15" height="15" rx="3" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="422" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">gala-dress</text><text x="696" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#898781" text-anchor="end">not read</text><rect x="398" y="240" width="298" height="1" rx="0" fill="#2c2c2a" stroke="none" stroke-width="1"/><text x="398" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#898781" text-anchor="start">0 read · nothing in this container was selected</text><text x="22" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Left: the container holds one selected event, so all of it is read — the other two are pure waste.</text><text x="22" y="323" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Right: the summary page rules the container out before any read, so it costs nothing at all.</text></svg>